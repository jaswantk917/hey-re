# "restaurants near me", "nearest atm": a Maps search around where the user is
english:
  - (find|show|search)? (me)? (some|a|the)? .what. (near|around) (me|here)
  - (find|show|search)? (me)? (some|a|the)? .what. nearby
  - (find|show|search)? (me)? (some|a|the)? nearby .what.
  - (find|show)? (me)? the? nearest|closest .what.

